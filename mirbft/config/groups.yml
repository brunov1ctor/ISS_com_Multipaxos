# Group configuration for MultiPaxos Multicast
# Difusão atômica seletiva: cada grupo tem membros específicos
# Nodes: 0..10 (total: 11 nodes)
# Variante: BAIXA SOBREPOSIÇÃO (contraste: groups-altasobreposicao.yml)
#
# Desenhado para testar a hipótese de que menor sobreposição entre grupos
# favorece o MultiPaxosMulticast frente ao MultiPaxos broadcast (ver
# Seção "Sobreposição de Grupos" do artigo). Com 5 nós e 4 grupos de 3,
# cada nó participava de 2-3 grupos (alta sobreposição, 60% de alcance por
# mensagem multicast). Aqui, com 11 nós, só 1 nó (0) é compartilhado entre
# dois grupos; todos os outros 10 participam de exatamente 1 grupo cada.
#
# NOTA: GroupId é singular (um grupo por mensagem)
# Para enviar para múltiplos grupos, use buckets diferentes ou expanda manualmente
#
# All groups have 3 nodes for fault tolerance (majority = 2)
# Node distribution:
#   Node 0:  groups [1, 4]  - único nó compartilhado entre 2 grupos
#   Node 1:  group  [1]
#   Node 2:  group  [1]
#   Node 3:  group  [2]
#   Node 4:  group  [2]
#   Node 5:  group  [2]
#   Node 6:  group  [3]
#   Node 7:  group  [3]
#   Node 8:  group  [3]
#   Node 9:  group  [4]
#   Node 10: group  [4]
#
# Alcance de uma mensagem multicast: 3/11 = 27,3% do cluster (vs 60% com
# 5 nós, vs 100% do broadcast) -- redução de 72,7% no tráfego por operação
# single-group (vs apenas 40% com 5 nós).

groups:             # O código cria o grupo 0 automaticamente
  1: [0, 1, 2]      # Group 1 (3 nodes) - fault tolerant
  2: [3, 4, 5]      # Group 2 (3 nodes) - fault tolerant
  3: [6, 7, 8]      # Group 3 (3 nodes) - fault tolerant
  4: [9, 10, 0]     # Group 4 (3 nodes) - fault tolerant
