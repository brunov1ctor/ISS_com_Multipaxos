# Group configuration for MultiPaxos Multicast
# Difusão atômica seletiva: cada grupo tem membros específicos
# Nodes: 0..10 (total: 11 nodes)
# Variante: ALTA SOBREPOSIÇÃO (contraste: variante baixa sobreposição,
# 4 grupos de 3, usada na topologia paralela pc536/..., alcance 27,3%)
#
# Desenhado para comparar, na MESMA escala de 11 nós, se maior sobreposição
# entre grupos (grupos maiores, menos numerosos) é melhor ou pior para o
# MultiPaxosMulticast do que a variante de baixa sobreposição (ver Seção
# "Sobreposição de Grupos" do artigo). 3 grupos de 6 nós, com sobreposição
# de 2 nós entre grupos consecutivos (janela deslizante com wraparound),
# recriando uma proporção de alcance por mensagem (54,5%) próxima da
# observada na célula original de 5 nós (60%), mas agora com 11 nós físicos
# reais.
#
# NOTA: GroupId é singular (um grupo por mensagem)
# Para enviar para múltiplos grupos, use buckets diferentes ou expanda manualmente
#
# All groups have 6 nodes for fault tolerance (majority = 4, tolera f=2)
# Node distribution:
#   Node 0:  groups [1, 3]
#   Node 1:  groups [1, 3]
#   Node 2:  groups [1, 3]
#   Node 3:  group  [1]
#   Node 4:  groups [1, 2]
#   Node 5:  groups [1, 2]
#   Node 6:  group  [2]
#   Node 7:  group  [2]
#   Node 8:  groups [2, 3]
#   Node 9:  groups [2, 3]
#   Node 10: group  [3]
#
# Alcance de uma mensagem multicast: 6/11 = 54,5% do cluster (vs 27,3% na
# variante baixa sobreposição com os mesmos 11 nós, vs 60% na célula
# original de 5 nós, vs 100% do broadcast).

groups:             # O código cria o grupo 0 automaticamente
  1: [0, 1, 2, 3, 4, 5]     # Group 1 (6 nodes) - quorum=4, tolera f=2
  2: [4, 5, 6, 7, 8, 9]     # Group 2 (6 nodes) - quorum=4, tolera f=2
  3: [8, 9, 10, 0, 1, 2]    # Group 3 (6 nodes) - quorum=4, tolera f=2
