# Group configuration for MultiPaxos Multicast
# Difusão atômica seletiva: cada grupo tem membros específicos
# Nodes: 0, 1, 2, 3, 4 (total: 5 nodes)
# 
# NOTA: GroupId é singular (um grupo por mensagem)
# Para enviar para múltiplos grupos, use buckets diferentes ou expanda manualmente
# 
# All groups have 3 nodes for fault tolerance (majority = 2)
# Node distribution:
#   Node 0: groups [1, 3]     - participates in 2 groups
#   Node 1: groups [1, 4]     - participates in 2 groups  
#   Node 2: groups [1, 2]     - participates in 2 groups
#   Node 3: groups [2, 4]     - participates in 2 groups
#   Node 4: groups [3, 4]     - participates in 2 groups

groups:
  1: [0, 1, 2]      # Group 1 (3 nodes) - fault tolerant
  2: [2, 3, 4]      # Group 2 (3 nodes) - fault tolerant  
  3: [0, 4, 1]      # Group 3 (3 nodes) - fault tolerant
  4: [1, 3, 4]      # Group 4 (3 nodes) - fault tolerant