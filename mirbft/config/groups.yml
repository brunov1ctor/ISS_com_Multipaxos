# Group configuration for 5-node SMR composition
# Nodes: 0, 1, 2, 3, 4 (total: 5 nodes)
# 
# EX: Group distribution analysis:
#   Node 0: groups [1, 3]     - participates in 2 groups
#   Node 1: groups [1, 4]     - participates in 2 groups  
#   Node 2: groups [1, 3]     - participates in 2 groups
#   Node 3: groups [2, 4]     - participates in 2 groups
#   Node 4: groups [2, 3, 4]  - participates in 3 groups
#
# Fault tolerance:
#   Groups 1,3,4: 3 nodes each → tolerates 1 failure (majority = 2)
#   Group 2: 2 nodes → no fault tolerance (both needed)

groups:
  1: [0, 1, 2]      # Storage SMR (3 nodes) - fault tolerant
  2: [3, 4]         # Index SMR (2 nodes) - no fault tolerance  
  3: [0, 2, 4]      # Cache SMR (3 nodes) - fault tolerant
  4: [1, 3, 4]      # Backup SMR (3 nodes) - fault tolerant

compositions:
  - name: "distributed_write"
    steps:
      - component: "storage"
        group: 1
      - component: "index"
        group: 2
  - name: "cached_read"
    steps:
      - component: "cache"
        group: 3
      - component: "storage"
        group: 1