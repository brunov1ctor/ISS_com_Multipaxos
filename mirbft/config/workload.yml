# Client Workload Configuration
# Defines operation types and their distribution
#
# Pattern syntax:
#   {seqNr:08d}       - Request sequence number (8 digits, zero-padded)
#   {seqNr+N:08d}     - Sequence number + offset N
#
# Examples:
#   seqNr=5:  "K{seqNr:08d}"                    -> "K00000005"
#   seqNr=5:  "K{seqNr:08d},K{seqNr+1000:08d}" -> "K00000005,K00001005"
#
# Group mapping:
#   Single key (GET)     -> single-group operation
#   Multiple keys (TX)   -> multi-group operation (requires atomic multicast)

workload:
  # Single-group operations (80%)
  - type: GET
    weight: 80
    pattern: "K{seqNr:08d}"
  
  # Multi-group operations (20%) - offset +1000 evita colisões de hash
  - type: TX
    weight: 20
    pattern: "K{seqNr:08d},K{seqNr+1000:08d}"
