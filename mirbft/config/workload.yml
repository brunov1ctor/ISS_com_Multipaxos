# Client Workload Configuration
# Defines operation types and their distribution
#
# Pattern syntax:
#   {seqNr:08d}       - Request sequence number (8 digits, zero-padded)
#   {seqNr+N:08d}     - Sequence number + offset N
#
# Examples:
#   seqNr=5:  "GET K{seqNr:08d}"                    -> "GET K00000005"
#   seqNr=5:  "TX K{seqNr:08d},K{seqNr+1000:08d}"  -> "TX K00000005,K00001005"
#
# Group mapping:
#   Single key (GET)     -> single-group operation
#   Multiple keys (TX)   -> multi-group operation (requires atomic multicast)

workload:
  # Single-group operations
  - weight: 80
    pattern: "GET K{seqNr:08d}"

  # Multi-group operations (cross-partition, requires sequencer)
  - weight: 20
    pattern: "TX K{seqNr:08d},K{seqNr+1000:08d}"
