syntax = "proto3";

option go_package = "./;protobufs";
package protobufs;

// Identificação do slot (aqui só SN; adapte se quiser epoch/segment).
message MPxInstanceId {
  int32  sn   = 1;
  uint64 lead = 2; // nodeId do líder proponente (opcional)
}

message MPxValue {
  MPxInstanceId id   = 1;
  bytes         batch = 2;  // protobuf-encoded Batch; vazio => ⊥
}

// Fase 1 (opcional nesta versão simplificada CFT)
message MPxPrepare  { MPxInstanceId id = 1; uint64 ballot = 2; }
message MPxPromise  { MPxInstanceId id = 1; uint64 ballot = 2; bool ok = 3; }

// Fase 2 (efetiva)
message MPxAccept   { MPxInstanceId id = 1; uint64 ballot = 2; MPxValue value = 3; }
message MPxAccepted { MPxInstanceId id = 1; uint64 ballot = 2; bool ok = 3; }

// Commit/announce (opcional; serve para convergência)
message MPxCommit   { MPxInstanceId id = 1; MPxValue value = 2; }

// Envelope
message MPxMsg {
  oneof type {
    MPxPrepare  prepare  = 1;
    MPxPromise  promise  = 2;
    MPxAccept   accept   = 3;
    MPxAccepted accepted = 4;
    MPxCommit   commit   = 5;
  }
}

